name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Compile-check critical server files
        run: |
          python3 -m py_compile src/pipeline_v2/app.py
          python3 -m py_compile src/pipeline_v2/service.py
          python3 -m py_compile src/pipeline_v2/config.py
          python3 -m py_compile src/pipeline_v2/models.py
          python3 -m py_compile src/pipeline_v2/xp_codec.py
          python3 -m py_compile src/pipeline_v2/gates.py
          python3 -m py_compile src/pipeline_v2/renderer.py
          python3 -m py_compile src/pipeline_v2/storage.py
          python3 -m py_compile wsgi.py

      - name: Run pytest (excluding e2e and Y9-2-data-dependent tests)
        run: |
          python3 -m pytest --ignore=tests/e2e \
            --ignore=tests/test_bundle_compile_output.py \
            --ignore=tests/test_render_plan_table.py \
            --ignore=tests/test_rig_compiler_math.py \
            --ignore=tests/test_rig_contract_schema.py \
            --ignore=tests/test_rig_dimension.py \
            --ignore=tests/test_rig_seam_visual_proof.py \
            --ignore=tests/test_semantic_socket_anchors.py \
            --ignore=tests/glyph_assignment \
            --ignore=tests/test_xp_uv_body_viewer_skin_discovery.py \
            --ignore=tests/test_source_layer_contract_viewer.py \
            --ignore=tests/test_runtime_contract_fail_closed.py \
            --ignore=tests/test_retract_upstream_xp_cell_role_decision.py \
            --ignore=tests/test_record_upstream_xp_coordinate_cell_decision.py \
            -q

      - name: Validate semantic maps
        run: python3 scripts/validate_semantic_maps.py

  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check critical JS files
        run: |
          node --check web/workbench.js
          node --check web/wizard.js
          node --check web/termpp_skin_lab.js
          node --check web/termpp_flat_map_bootstrap.js
