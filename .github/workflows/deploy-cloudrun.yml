name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "master"

env:
  GCP_PROJECT_ID: yuzu-agent
  GCP_REGION: us-central1
  SERVICE_NAME: asciicker-xpedit
  AR_REPO: asciicker-xpedit
  GCP_SERVICE_ACCOUNT: github-deploy@yuzu-agent.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  # ── Job 1: Build, test, push image ──
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_url: ${{ steps.meta.outputs.image_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || 'master' }}
          submodules: false  # Y9-2 is private; deploy runtime does not need it (FL-2026-06-03)

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-deploy tests
        run: |
          pip install -e ".[deploy]" pytest
          python3 -m py_compile src/pipeline_v2/app.py
          python3 -m py_compile src/pipeline_v2/service.py
          python3 -m py_compile src/pipeline_v2/config.py
          python3 -m py_compile wsgi.py
          # Skip tests that need Y9-2 PYTHONPATH not available on CI (non-deploy-blocking)
          # Also skip glyph_assignment matcher tests and skin discovery — those
          # reference data files only present via the Y9-2 symlink (FL-2026-06-03).
          python3 -m pytest --ignore=tests/e2e \
            --ignore=tests/test_bundle_compile_output.py \
            --ignore=tests/test_render_plan_table.py \
            --ignore=tests/test_rig_compiler_math.py \
            --ignore=tests/test_rig_contract_schema.py \
            --ignore=tests/test_rig_dimension.py \
            --ignore=tests/test_rig_seam_visual_proof.py \
            --ignore=tests/test_semantic_socket_anchors.py \
            --ignore=tests/glyph_assignment \
            --ignore=tests/test_xp_uv_body_viewer_skin_discovery.py \
            -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image metadata
        id: meta
        run: |
          SHA="$(git rev-parse --short HEAD)"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/xpedit"
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_url=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -t "${{ steps.meta.outputs.image_url }}" .
          docker push "${{ steps.meta.outputs.image_url }}"

  # ── Job 2: Deploy exact image to Cloud Run ──
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build-and-push.outputs.image_url }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --port=8080
            --concurrency=80
          env_vars: |
            PIPELINE_BASE_PATH=/xpedit
            PIPELINE_HOST=0.0.0.0
            BUG_REPORT_DELIVERY=github
            BUG_REPORT_GITHUB_REPO=rikiyanai/asciicker-xpedit
          secrets: |
            BUG_REPORT_GITHUB_TOKEN=bug-report-github-token:latest

  # ── Job 3: Post-deploy smoke test ──
  smoke-test:
    needs: [deploy, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Y9-2 is private; deploy runtime does not need it (FL-2026-06-03)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch service URL
        id: svc
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: ${URL}"

      - name: Wait for service to stabilize
        run: sleep 5

      - name: Run smoke tests (stateless + stateful)
        run: |
          BASE_URL="${{ steps.svc.outputs.url }}" \
          PREFIX="/xpedit" \
          ./scripts/deploy/smoke_test.sh

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** ${{ github.event.inputs.target_ref || 'master' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ needs.build-and-push.outputs.image_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${{ steps.svc.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service:** ${{ env.SERVICE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
